<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Tasks</title>
    <!--
      Preloader: painted from plain HTML/CSS before any script loads, so the
      popup (and the desktop window) never flashes white or blank. React's
      <Splash> renders the same markup until the app has booted, then the
      first screen fades in over it.
    -->
    <style>
      html { background: #10191c; color-scheme: dark; }
      .st-pl {
        position: fixed; inset: 0; z-index: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: radial-gradient(circle at top left, #122c32 0%, #10191c 60%, #0d1112 100%);
        font: 600 14px/1 'Segoe UI', system-ui, -apple-system, sans-serif; color: #8fa3a8;
      }
      .st-pl-mark { position: relative; width: 60px; height: 60px; animation: st-pl-float 2.4s ease-in-out infinite; }
      .st-pl-mark::before {
        content: ''; position: absolute; inset: -14px; border-radius: 50%;
        background: radial-gradient(circle, rgba(63, 209, 197, .38), transparent 68%);
        animation: st-pl-glow 2.4s ease-in-out infinite;
      }
      .st-pl-mark svg { position: relative; display: block; width: 60px; height: 60px; }
      .st-pl-check { stroke-dasharray: 360; stroke-dashoffset: 360; animation: st-pl-draw 1.1s .15s cubic-bezier(.65, 0, .35, 1) forwards; }
      .st-pl-bar { width: 112px; height: 3px; border-radius: 3px; overflow: hidden; background: rgba(255, 255, 255, .07); }
      .st-pl-bar::after {
        content: ''; display: block; width: 40%; height: 100%; border-radius: 3px;
        background: linear-gradient(90deg, #6ff0dc, #2794bd);
        animation: st-pl-slide 1.15s ease-in-out infinite;
      }
      @keyframes st-pl-float { 50% { transform: translateY(-5px); } }
      @keyframes st-pl-glow { 50% { opacity: .45; transform: scale(.9); } }
      @keyframes st-pl-draw { to { stroke-dashoffset: 0; } }
      @keyframes st-pl-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) {
        .st-pl-mark, .st-pl-mark::before, .st-pl-bar::after { animation: none; }
        .st-pl-check { animation: none; stroke-dashoffset: 0; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="st-pl" role="status" aria-label="Loading Smart Tasks">
        <span class="st-pl-mark" aria-hidden="true">
          <svg viewBox="16 16 480 480">
            <defs>
              <linearGradient id="stplbg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#6ff0dc" /><stop offset=".5" stop-color="#3fd1c5" /><stop offset="1" stop-color="#2794bd" />
              </linearGradient>
            </defs>
            <rect x="16" y="16" width="480" height="480" rx="124" fill="url(#stplbg)" />
            <rect x="100" y="120" width="140" height="36" rx="18" fill="#0b1a1c" opacity=".22" />
            <rect x="100" y="190" width="88" height="36" rx="18" fill="#0b1a1c" opacity=".22" />
            <path class="st-pl-check" d="M164 318 L234 386 L404 214" fill="none" stroke="#0b1a1c" stroke-width="62" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M392 64 C396 92 404 100 432 104 C404 108 396 116 392 144 C388 116 380 108 352 104 C380 100 388 92 392 64 Z" fill="#fff" />
          </svg>
        </span>
        <span>Smart Tasks</span>
        <span class="st-pl-bar"></span>
      </div>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
