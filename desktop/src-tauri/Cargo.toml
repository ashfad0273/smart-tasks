[package]
name = "smart-tasks"
version = "1.8.4"
description = "Smart Tasks for Windows and macOS"
edition = "2021"
publish = false

[[bin]]
name = "smart-tasks"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
# Clipboard sync: read/write text and images, PNG for the images in transit.
arboard = { version = "3", default-features = false, features = ["image-data"] }
png = "0.18"

# Windows: toasts with buttons, the Run key and the toast AppUserModelID.
[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8.1"
winreg = "0.56.0"
windows-sys = { version = "0.59", features = ["Win32_System_DataExchange"] }

# macOS: Notification Center banners with action buttons.
[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }

# Small, size-first release build: one codegen unit + fat LTO lets the
# optimizer drop everything unused; panics abort instead of unwinding.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
incremental = false
