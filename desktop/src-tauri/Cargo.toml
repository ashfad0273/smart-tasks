[package]
name = "smart-tasks"
version = "1.6.0"
description = "Smart Tasks for Windows and macOS"
edition = "2021"
publish = false

[[bin]]
name = "smart-tasks"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"

# Windows: toasts with buttons, the Run key and the toast AppUserModelID.
[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8.1"
winreg = "0.56.0"

# macOS: Notification Center banners with action buttons.
[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"

# Small, size-first release build: one codegen unit + fat LTO lets the
# optimizer drop everything unused; panics abort instead of unwinding.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
incremental = false
